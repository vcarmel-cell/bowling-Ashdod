<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ליגת באולינג — טבלת דירוג</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #EFF9FF; color: #0C4A6E; direction: rtl; min-height: 100vh; }

header {
  background: linear-gradient(135deg, #0369A1 0%, #083D5C 100%);
  color: #fff; padding: 22px 20px;
  box-shadow: 0 4px 20px rgba(8,61,92,0.2);
}
.header-inner { display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; text-align: right; }
header .brand {
  font-size: 88px; width: 128px; height: 128px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
header .brand img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
header h1 { font-size: 24px; font-weight: 800; }
header p { font-size: 13px; color: #7DD3FC; margin-top: 4px; }

.wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }

.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab {
  padding: 10px 18px; border-radius: 10px; cursor: pointer;
  background: #fff; border: 1.5px solid #BAE6FD; color: #0369A1;
  font-size: 14px; font-weight: 700; transition: all .15s;
}
.tab:hover { background: #E0F2FE; }
.tab.active { background: linear-gradient(135deg, #0EA5E9, #0284C7); color: #fff; border-color: transparent; }

.section { display: none; }
.section.active { display: block; }

.card {
  background: #fff; border-radius: 16px; border: 1px solid #BAE6FD;
  padding: 22px; box-shadow: 0 2px 14px rgba(14,165,233,0.08); margin-bottom: 18px;
}
.card h2 { font-size: 16px; margin-bottom: 14px; color: #0C4A6E; }

.table-wrap { overflow-x: auto; }

.chart-wrap { overflow-x: auto; text-align: left; }
.chart-bar-hit { cursor: pointer; }
.chart-bar-hit:hover rect.chart-bar, .chart-bar-hit:focus rect.chart-bar { fill: #0284C7; }
.chart-bar-hit:focus { outline: none; }
.chart-bar-hit:focus rect.chart-bar { stroke: #083D5C; stroke-width: 2; }
.chart-tooltip {
  position: fixed; display: none; pointer-events: none; z-index: 50;
  background: #083D5C; color: #fff; font-size: 12px; line-height: 1.5;
  padding: 7px 10px; border-radius: 8px; box-shadow: 0 4px 14px rgba(8,61,92,0.25);
  white-space: nowrap;
}
.chart-tooltip strong { font-size: 13px; }
.chart-toggle-btn {
  font-size: 12px; font-weight: 700; color: #0369A1; background: #F0F9FF;
  border: 1px solid #BAE6FD; border-radius: 8px; padding: 5px 10px; cursor: pointer;
}
.chart-toggle-btn:hover { background: #E0F2FE; }
.ask-btn {
  font-size: 14px; font-weight: 700; color: #fff;
  background: linear-gradient(135deg, #0EA5E9, #0284C7); border: none;
  border-radius: 8px; padding: 9px 18px; cursor: pointer;
}
.ask-btn:hover { filter: brightness(1.05); }
.qa-chip {
  font-size: 13px; font-weight: 600; color: #0369A1; background: #F0F9FF;
  border: 1.5px solid #BAE6FD; border-radius: 20px; padding: 6px 14px; cursor: pointer;
}
.qa-chip:hover { background: #E0F2FE; }
table { width: 100%; border-collapse: collapse; }
th {
  background: #F0F9FF; text-align: right; padding: 10px 12px; font-size: 13px;
  font-weight: 700; color: #0369A1; border-bottom: 2px solid #BAE6FD; white-space: nowrap;
}
td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #E0F2FE; color: #0C4A6E; white-space: nowrap; }
tr:last-child td { border-bottom: none; }

.color-dot { display:inline-block; width:11px; height:11px; border-radius:50%; margin-left:8px; vertical-align:middle; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; background: #E0F2FE; color: #0369A1; }
.rank-1 td:first-child { color: #D97706; font-weight: 900; }
.rank-2 td:first-child { color: #64748B; font-weight: 900; }
.rank-3 td:first-child { color: #B45309; font-weight: 900; }

.empty-state { text-align: center; padding: 40px 20px; color: #7DD3FC; }
.empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; }

.loading, .config-msg {
  text-align: center; padding: 60px 20px; color: #0369A1; font-size: 14px;
}
.config-msg { color: #B91C1C; max-width: 480px; margin: 40px auto; background: #fff; border-radius: 16px; border: 1px solid #FECACA; padding: 28px; }

footer { text-align: center; padding: 20px; color: #7DD3FC; font-size: 12px; }

@media (max-width: 600px) {
  header h1 { font-size: 20px; }
  .tab { flex: 1; text-align: center; padding: 10px 8px; font-size: 13px; }
}
</style>

<body>

<header>
  <div class="header-inner">
    <div class="brand" id="league-logo">&#x1F3B3;</div>
    <div>
      <h1 id="league-name">ליגת באולינג</h1>
      <p>טבלת דירוג, לוח משחקים ותוצאות — עדכני בזמן אמת</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="content">
    <div class="loading">&#x23F3; טוען נתונים...</div>
  </div>
</div>

<footer>ליגת באולינג &copy; <span id="footer-year"></span> · תצוגה ציבורית לצפייה בלבד</footer>

<script>
// ─── CONFIGURE YOUR FIREBASE PROJECT HERE ───────────────────────
// Use the exact same Firebase Config you pasted into admin.html's
// setup screen (Firebase console → Project settings → Your apps).
// This page mostly *reads* data (Firestore rules require authentication for
// any write, same as admin.html) — the one exception is saveAskedQuestion()
// below, which anonymously signs this page in too, purely to log what
// visitors type into the "שאל שאלה" box for admin.html to review later.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBzP45MyGTnrnrlbj4jOiGWDpjDBNVUSpQ",
  authDomain: "bowling-leage.firebaseapp.com",
  projectId: "bowling-leage",
  storageBucket: "bowling-leage.firebasestorage.app",
  messagingSenderId: "3652484366",
  appId: "1:3652484366:web:79bb952c34628313c8ab5f"
};
// Set once in boot(); reused by saveAskedQuestion() so it doesn't need its
// own Firestore handle.
let fdb = null;

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('he-IL');
}

function loadFirebaseSDK() {
  return new Promise(resolve => {
    const timer = setTimeout(() => resolve(false), 8000);
    function load(src, next) {
      const s = document.createElement('script');
      s.src = src;
      s.onerror = () => { clearTimeout(timer); resolve(false); };
      s.onload = next;
      document.head.appendChild(s);
    }
    load('https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js', () =>
      load('https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js', () =>
        load('https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js', () => {
          clearTimeout(timer); resolve(true);
        })
      )
    );
  });
}

// Operative per-game team total (handicap-inclusive when the league has
// handicap enabled; equal to the raw total otherwise). Falls back to the
// legacy `teamATotal`/`teamBTotal` field for results saved before handicap
// support existed.
function gameTotal(g, side) {
  return g[`team${side}HcpTotal`] ?? g[`team${side}Total`] ?? 0;
}

// Same fallback pattern as gameTotal, but the raw (no-handicap) total —
// used for the team series record, which is meant to compare pure pinfall.
function rawGameTotal(g, side) {
  return g[`team${side}RawTotal`] ?? g[`team${side}Total`] ?? 0;
}

// A player's cumulative pins across the season up to and including the given
// round date (ISO strings compare correctly). Counts every recorded game,
// including practice sessions, so it matches the per-round totals shown.
function seasonPinsThrough(DB, playerId, dateStr) {
  let total = 0;
  DB.results.forEach(r => {
    if (!r.date || r.date > dateStr) return;
    (r.games || []).forEach(g => {
      const s = g.playerScores && g.playerScores[playerId];
      if (s != null) total += s;
    });
  });
  return total;
}

// Average raw pins per individual game bowled on one round date, across every
// player together — team matches and practice sessions alike, excluding any
// score auto-filled for a player marked absent (that's a stand-in for the
// team total, not a real game). Dividing by the game count (not the player
// count) is what makes this a fair quality measure: a round with more people
// playing adds to both the pins total and the game count together, so
// attendance doesn't skew it the way a plain sum would. Same per-game
// definition of "average" used everywhere else on this page (playerStatsFor).
function avgPinsForRound(DB, dateStr) {
  let total = 0, games = 0;
  DB.results.forEach(r => {
    if (r.date !== dateStr) return;
    const absent = r.absentPlayerIds || [];
    (r.games || []).forEach(g => {
      Object.entries(g.playerScores || {}).forEach(([pid, score]) => {
        if (score == null || absent.includes(pid)) return;
        total += score; games++;
      });
    });
  });
  return games ? total / games : 0;
}

// Every time the all-time personal single-game high score was broken,
// walking the season in round order. Compares the BEST score of each round
// (not every individual game) against the running record — games on the
// same date have no real time order between them, so scanning them one by
// one would call a same-day climb from game to game a sequence of separate
// "records," which isn't a real story. One round can therefore produce at
// most one milestone. roundDatesAsc must already be every played round in
// chronological order, since that's what positions each milestone on the
// chart's round axis. Absent-filled scores are excluded, same as the
// "שיא אישי למשחק בודד" table this is the timeline version of.
function recordMilestones(DB, roundDatesAsc) {
  const byDate = {};
  DB.results.forEach(r => (r.games || []).forEach(g => {
    Object.entries(g.playerScores || {}).forEach(([pid, score]) => {
      if (score == null || (r.absentPlayerIds && r.absentPlayerIds.includes(pid))) return;
      (byDate[r.date] = byDate[r.date] || []).push({ pid, score });
    });
  }));
  let runningMax = -1;
  const milestones = [];
  roundDatesAsc.forEach((d, roundIndex) => {
    const dayEntries = byDate[d] || [];
    if (!dayEntries.length) return;
    const best = dayEntries.reduce((a, b) => (b.score > a.score ? b : a));
    if (best.score > runningMax) {
      runningMax = best.score;
      milestones.push({ date: d, roundIndex, score: best.score, pid: best.pid });
    }
  });
  return milestones;
}

// Extends a chronological list of already-played round dates with the next
// scheduled-but-not-yet-played round (if any) — every round chart ends one
// round past the latest result instead of stopping abruptly at the edge of
// the data, so there's visible room on the axis for what's coming. "Not yet
// played" means no result exists for that date at all, regardless of a
// schedule row's own status field.
function withNextRound(DB, playedDatesAsc) {
  const played = new Set(playedDatesAsc);
  const next = [...new Set(DB.schedule.map(s => s.date))].filter(d => d && !played.has(d)).sort()[0];
  return next ? [...playedDatesAsc, next] : playedDatesAsc;
}

// Compact axis/tick formatting: 1,000+ collapses to "1K"/"1.5K"; below that,
// the plain rounded number.
function compactNum(n) {
  if (n >= 1000) {
    const k = n / 1000;
    return (Math.round(k * 10) / 10).toString().replace(/\.0$/, '') + 'K';
  }
  return String(Math.round(n));
}

// Rounds an axis max up to a "nice" 1/2/5-times-a-power-of-ten value, so
// gridlines land on round numbers instead of the raw data max.
function niceAxisMax(maxVal) {
  if (maxVal <= 0) return 10;
  const magnitude = Math.pow(10, Math.floor(Math.log10(maxVal)));
  const residual = maxVal / magnitude;
  const niceResidual = residual <= 1 ? 1 : residual <= 2 ? 2 : residual <= 5 ? 5 : 10;
  return niceResidual * magnitude;
}

// Bar chart of average raw pins per game for each round (`r.avg`, from
// avgPinsForRound), across every player together — one bar per round. A
// single series, so no legend box; the card title names what's plotted.
// Plain inline SVG, no chart library, to match the rest of the page. Each
// bar is a real SVG element (not a <img>/canvas snapshot) with its own
// hover/focus tooltip; a plain-table fallback (built by the caller) keeps
// every value reachable without hovering.
function buildRoundPinsChartHtml(rounds) {
  if (!rounds.length) return `<p style="text-align:center;color:#94A3B8;padding:20px;">אין נתונים עדיין</p>`;
  // Extra top room for the value label printed above every bar; extra bottom
  // room for the round-number ticks plus the "מחזור" axis title under them;
  // extra left room for the Y-axis numbers (see padLeft note below).
  const bandW = 46, chartH = 240, padTop = 34, padBottom = 42, padLeft = 32, padRight = 6;
  const plotH = chartH - padTop - padBottom;
  const baselineY = padTop + plotH;
  const chartW = Math.max(rounds.length * bandW + padLeft + padRight, 320);
  const axisMax = niceAxisMax(Math.max(0, ...rounds.map(r => r.avg || 0)) * 1.15);
  const barMaxW = 24;

  // Y-axis numbers sit at the LEFT edge with text-anchor="start": Chromium
  // (at least the version this was tested on) fails to render SVG <text>
  // with text-anchor="end" at all when nested under an RTL-direction
  // ancestor (this page is dir="rtl") — not just mispositioned, genuinely
  // invisible. "start"/"middle" anchors are unaffected, so the axis lives
  // on the left instead of the conventional right.
  const gridlines = Array.from({ length: 5 }, (_, i) => {
    const val = axisMax * i / 4;
    const y = baselineY - (val / axisMax) * plotH;
    return `<line x1="${padLeft}" y1="${y}" x2="${chartW - padRight}" y2="${y}" stroke="#E0F2FE" stroke-width="1"/>
      <text x="2" y="${y - 3}" font-size="10" fill="#94A3B8">${compactNum(val)}</text>`;
  }).join('');
  // Axis titles: "פינים" (Y) above the Y-axis numbers it labels; "מחזור" (X)
  // centered under the round-number ticks.
  const axisTitles = `
    <text x="2" y="12" font-size="11" fill="#0369A1" font-weight="700">פינים &#8593;</text>
    <text x="${padLeft + (chartW - padLeft - padRight) / 2}" y="${chartH - 4}" font-size="11" fill="#0369A1" font-weight="700" text-anchor="middle">מחזור &#8594;</text>`;

  const bars = rounds.map((r, i) => {
    const band = (chartW - padLeft - padRight) / rounds.length;
    const barW = Math.min(barMaxW, band - 6);
    const x = padLeft + band * i + (band - barW) / 2;
    const hasData = r.avg != null;
    const barH = hasData && axisMax ? (r.avg / axisMax) * plotH : 0;
    const barY = baselineY - barH;
    const rTop = Math.min(4, barH);
    const path = barH <= 0 ? '' : rTop > 0
      ? `M${x},${barY + rTop} Q${x},${barY} ${x + rTop},${barY} L${x + barW - rTop},${barY} Q${x + barW},${barY} ${x + barW},${barY + rTop} L${x + barW},${baselineY} L${x},${baselineY} Z`
      : `M${x},${barY} L${x + barW},${barY} L${x + barW},${baselineY} L${x},${baselineY} Z`;
    const roundNum = (r.label.match(/\d+/) || [])[0] || String(i + 1);
    const tipText = hasData
      ? `${r.label} · ${fmtDate(r.date)}\nממוצע ${r.avg.toFixed(1)} פינים למשחק`
      : `${r.label} · ${fmtDate(r.date)}\nטרם שוחק`;
    // Escaped for use inside a single-quoted JS string literal embedded in an
    // HTML attribute — a raw newline there would break the inline handler
    // with a syntax error, so it has to become the two-character \n escape.
    const tipJs = tipText.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
    return `
      <g class="chart-bar-hit" tabindex="0" role="img" aria-label="${r.label}, ${fmtDate(r.date)}, ${hasData ? `ממוצע ${r.avg.toFixed(1)} פינים למשחק` : 'טרם שוחק'}"
         onpointerenter="showChartTooltip(event, '${tipJs}')"
         onpointermove="moveChartTooltip(event)"
         onpointerleave="hideChartTooltip()"
         onfocus="showChartTooltip(event, '${tipJs}')"
         onblur="hideChartTooltip()">
        <rect x="${padLeft + band * i}" y="${padTop}" width="${band}" height="${plotH}" fill="transparent"/>
        ${path ? `<path class="chart-bar" d="${path}" fill="#0EA5E9"/>` : ''}
        ${barH > 0 ? `<text x="${x + barW / 2}" y="${Math.max(padTop - 6, barY - 6)}" font-size="9.5" fill="#0C4A6E" font-weight="700" text-anchor="middle">${r.avg.toFixed(1)}</text>` : ''}
        <text x="${x + barW / 2}" y="${chartH - padBottom + 16}" font-size="11" fill="#64748B" text-anchor="middle">${roundNum}</text>
      </g>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${chartW} ${chartH}" width="${chartW}" height="${chartH}" style="display:block; direction:ltr; margin-right:auto;" direction="ltr">
      ${gridlines}
      ${axisTitles}
      ${bars}
    </svg>`;
}

// Each team's cumulative league points across the season, round by round —
// the standings "race" itself, not just the current snapshot the standings
// table shows. One line per team, colored with that team's own `color`
// (the same color used everywhere else on the page — teams/standings/the
// per-round points table), so identity stays consistent with the rest of
// the site rather than introducing a separate chart palette (not a
// generated categorical scheme, so the usual CVD-pair validation doesn't
// apply — these are the league's own pre-existing per-team colors). A
// shared crosshair plus ONE tooltip listing every team's value at the
// hovered round — the standard multi-line pattern (interaction.md: "one
// tooltip, every series") — stands in for direct end-labels, which would
// collide with this many series converging.
function buildTeamPointsLineChartHtml(teams, rounds) {
  if (!rounds.length || !teams.length) return `<p style="text-align:center;color:#94A3B8;padding:20px;">אין נתונים עדיין</p>`;
  const bandW = 40, chartH = 260, padTop = 20, padBottom = 42, padLeft = 32, padRight = 10;
  const plotH = chartH - padTop - padBottom;
  const baselineY = padTop + plotH;
  const chartW = Math.max(rounds.length * bandW + padLeft + padRight, 320);
  const plotW = chartW - padLeft - padRight;
  const maxVal = Math.max(1, ...rounds.map(r => r.cum ? Math.max(0, ...teams.map(t => r.cum[t.id] || 0)) : 0));
  const axisMax = niceAxisMax(maxVal * 1.1);
  const xAt = i => rounds.length > 1 ? padLeft + (plotW * i / (rounds.length - 1)) : padLeft + plotW / 2;
  const yAt = v => baselineY - (axisMax ? (v / axisMax) * plotH : 0);

  const gridlines = Array.from({ length: 5 }, (_, i) => {
    const val = axisMax * i / 4;
    const y = baselineY - (val / axisMax) * plotH;
    return `<line x1="${padLeft}" y1="${y}" x2="${chartW - padRight}" y2="${y}" stroke="#E0F2FE" stroke-width="1"/>
      <text x="2" y="${y - 3}" font-size="10" fill="#94A3B8">${compactNum(val)}</text>`;
  }).join('');
  const axisTitles = `
    <text x="2" y="12" font-size="11" fill="#0369A1" font-weight="700">נק&#39; מצטבר &#8593;</text>
    <text x="${padLeft + plotW / 2}" y="${chartH - 4}" font-size="11" fill="#0369A1" font-weight="700" text-anchor="middle">מחזור &#8594;</text>`;

  // Rounds without cum data (the upcoming round-with-no-result-yet
  // withNextRound appends) extend the axis but aren't part of the drawn
  // line — they're always trailing, since every played round comes first.
  const dataPoints = rounds.map((r, i) => ({ r, i })).filter(x => x.r.cum);
  const lines = teams.map(t => {
    const d = dataPoints.map(({ r, i }, idx) => `${idx === 0 ? 'M' : 'L'}${xAt(i)},${yAt(r.cum[t.id] || 0)}`).join(' ');
    return `<path d="${d}" fill="none" stroke="${t.color || '#94A3B8'}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');

  const roundTicks = rounds.map((r, i) => {
    const roundNum = (r.label.match(/\d+/) || [])[0] || String(i + 1);
    return `<text x="${xAt(i)}" y="${chartH - padBottom + 16}" font-size="10" fill="#64748B" text-anchor="middle">${roundNum}</text>`;
  }).join('');

  const band = plotW / rounds.length;
  const hitBands = rounds.map((r, i) => {
    const tipLines = r.cum
      ? [`${r.label} · ${fmtDate(r.date)}`, ...[...teams].sort((a, b) => (r.cum[b.id] || 0) - (r.cum[a.id] || 0)).map(t => `${t.name}: ${r.cum[t.id] || 0}`)]
      : [`${r.label} · ${fmtDate(r.date)}`, 'טרם שוחק'];
    const tipJs = tipLines.join('\n').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
    const x = padLeft + band * i;
    const cx = xAt(i);
    return `
      <g tabindex="0" role="img" aria-label="${r.label}, ${fmtDate(r.date)}"
         onpointerenter="showChartTooltip(event, '${tipJs}'); showCrosshair('team-points-crosshair', ${cx}, ${padTop}, ${baselineY})"
         onpointermove="moveChartTooltip(event)"
         onpointerleave="hideChartTooltip(); hideCrosshair('team-points-crosshair')"
         onfocus="showChartTooltip(event, '${tipJs}'); showCrosshair('team-points-crosshair', ${cx}, ${padTop}, ${baselineY})"
         onblur="hideChartTooltip(); hideCrosshair('team-points-crosshair')">
        <rect x="${x}" y="${padTop}" width="${band}" height="${plotH}" fill="transparent"/>
      </g>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${chartW} ${chartH}" width="${chartW}" height="${chartH}" style="display:block; direction:ltr; margin-right:auto;" direction="ltr">
      ${gridlines}
      ${axisTitles}
      <line id="team-points-crosshair" x1="0" y1="${padTop}" x2="0" y2="${baselineY}" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" style="display:none;"/>
      ${lines}
      ${roundTicks}
      ${hitBands}
    </svg>`;
}

// Timeline of the all-time personal single-game record being broken — a
// step chart (the value is flat between milestones, by definition), each
// milestone direct-labeled with who set it (sparse enough — a handful a
// season — that direct labels work; see marks-and-anatomy.md). The last
// segment extends to the most recent round, since that record still stands
// as of now. getPlayerName resolves a player id to a display name.
function buildRecordsTimelineChartHtml(roundDatesAsc, milestones, getPlayerName) {
  if (!milestones.length) return `<p style="text-align:center;color:#94A3B8;padding:20px;">אין נתונים עדיין</p>`;
  const totalRounds = roundDatesAsc.length;
  const bandW = 50, chartH = 230, padTop = 40, padBottom = 30, padLeft = 32, padRight = 10;
  const plotH = chartH - padTop - padBottom;
  const baselineY = padTop + plotH;
  const chartW = Math.max(totalRounds * bandW + padLeft + padRight, 320);
  const plotW = chartW - padLeft - padRight;
  const maxScore = Math.max(...milestones.map(m => m.score));
  const axisMax = niceAxisMax(maxScore * 1.1);
  const axisMin = 0;
  const xAt = i => totalRounds > 1 ? padLeft + (plotW * i / (totalRounds - 1)) : padLeft + plotW / 2;
  const yAt = v => baselineY - plotH * (v - axisMin) / (axisMax - axisMin || 1);

  const gridlines = Array.from({ length: 5 }, (_, i) => {
    const val = axisMax * i / 4;
    const y = baselineY - (val / axisMax) * plotH;
    return `<line x1="${padLeft}" y1="${y}" x2="${chartW - padRight}" y2="${y}" stroke="#E0F2FE" stroke-width="1"/>
      <text x="2" y="${y - 3}" font-size="10" fill="#94A3B8">${compactNum(val)}</text>`;
  }).join('');
  const axisTitles = `
    <text x="2" y="12" font-size="11" fill="#0369A1" font-weight="700">ציון &#8593;</text>
    <text x="${padLeft + plotW / 2}" y="${chartH - 4}" font-size="11" fill="#0369A1" font-weight="700" text-anchor="middle">מחזור &#8594;</text>`;

  // Step path: flat at each record's score from its own round to just
  // before the next record, then a vertical jump; the final flat segment
  // runs out to the most recently played round.
  let stepD = `M${xAt(milestones[0].roundIndex)},${yAt(milestones[0].score)}`;
  milestones.forEach((m, i) => {
    const nextX = i + 1 < milestones.length ? xAt(milestones[i + 1].roundIndex) : xAt(totalRounds - 1);
    stepD += ` L${nextX},${yAt(m.score)}`;
    if (i + 1 < milestones.length) stepD += ` L${nextX},${yAt(milestones[i + 1].score)}`;
  });
  const stepLine = `<path d="${stepD}" fill="none" stroke="#0EA5E9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;

  const roundTicks = roundDatesAsc.map((d, i) =>
    `<text x="${xAt(i)}" y="${chartH - padBottom + 16}" font-size="10" fill="#64748B" text-anchor="middle">${i + 1}</text>`
  ).join('');

  const markers = milestones.map((m, i) => {
    const cx = xAt(m.roundIndex), cy = yAt(m.score);
    const name = getPlayerName(m.pid);
    // Alternate the label above/below so consecutive close-together records
    // don't stack their text on top of each other.
    const labelY = i % 2 === 0 ? cy - 20 : cy + 26;
    const tipText = `${name}\n${m.score} פינים · ${fmtDate(m.date)}`;
    const tipJs = tipText.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
    return `
      <g tabindex="0" role="img" aria-label="${name}, ${m.score} פינים, ${fmtDate(m.date)}"
         onpointerenter="showChartTooltip(event, '${tipJs}')"
         onpointermove="moveChartTooltip(event)"
         onpointerleave="hideChartTooltip()"
         onfocus="showChartTooltip(event, '${tipJs}')"
         onblur="hideChartTooltip()">
        <circle cx="${cx}" cy="${cy}" r="12" fill="transparent"/>
        <circle cx="${cx}" cy="${cy}" r="5" fill="#0EA5E9" stroke="#fff" stroke-width="2"/>
        <text x="${cx}" y="${labelY}" font-size="9.5" fill="#0C4A6E" font-weight="700" text-anchor="middle">${name}</text>
        <text x="${cx}" y="${labelY + 11}" font-size="9.5" fill="#0369A1" text-anchor="middle">${m.score}</text>
      </g>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${chartW} ${chartH}" width="${chartW}" height="${chartH}" style="display:block; direction:ltr; margin-right:auto;" direction="ltr">
      ${gridlines}
      ${axisTitles}
      ${stepLine}
      ${roundTicks}
      ${markers}
    </svg>`;
}

// Shared across every chart on the page (bar, line, scatter) — only one
// tooltip can be showing at a time, so one fixed-position element/function
// set does for all of them instead of duplicating this per chart.
function showChartTooltip(evt, text) {
  const el = document.getElementById('chart-tooltip');
  if (!el) return;
  el.innerHTML = '';
  text.split('\n').forEach((line, i) => {
    const row = document.createElement(i === 0 ? 'div' : 'strong');
    row.textContent = line;
    el.appendChild(row);
  });
  el.style.display = 'block';
  moveChartTooltip(evt);
}
function moveChartTooltip(evt) {
  const el = document.getElementById('chart-tooltip');
  if (!el || el.style.display === 'none') return;
  // Keyboard focus carries no pointer coordinates — anchor to the mark's own
  // position on screen instead.
  let px = evt.clientX, py = evt.clientY;
  if (px == null && evt.target && evt.target.getBoundingClientRect) {
    const rect = evt.target.getBoundingClientRect();
    px = rect.left + rect.width / 2;
    py = rect.top;
  }
  const pad = 14;
  let x = px + pad, y = py + pad;
  if (x + 220 > window.innerWidth) x = px - 220 - pad;
  if (y + 100 > window.innerHeight) y = py - 100 - pad;
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}
function hideChartTooltip() {
  const el = document.getElementById('chart-tooltip');
  if (el) el.style.display = 'none';
}
// A vertical hairline that snaps to the hovered/focused round on a line
// chart — the crosshair finds the X, per interaction.md, instead of making
// the reader aim at a 2px line.
function showCrosshair(id, x, y1, y2) {
  const el = document.getElementById(id);
  if (!el) return;
  el.setAttribute('x1', x); el.setAttribute('x2', x);
  el.setAttribute('y1', y1); el.setAttribute('y2', y2);
  el.style.display = '';
}
function hideCrosshair(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = 'none';
}
// Generic chart/table toggle — id-prefix lets every chart card reuse it
// instead of a bespoke toggle function each (see id pattern below: each
// chart card has "<prefix>-chart-wrap" / "-table-wrap" / "-btn-chart" / "-btn-table").
function toggleChartView(prefix, view) {
  document.getElementById(prefix + '-chart-wrap').style.display = view === 'chart' ? '' : 'none';
  document.getElementById(prefix + '-table-wrap').style.display = view === 'table' ? '' : 'none';
  document.getElementById(prefix + '-btn-chart').setAttribute('aria-pressed', String(view === 'chart'));
  document.getElementById(prefix + '-btn-table').setAttribute('aria-pressed', String(view === 'table'));
}

// Teams excluded from the team competition (currently just פייסרים) never
// get a scheduled match, so they're left out of standings/team records
// entirely — their players' games only count toward personal stats.
function schedulableTeams(DB) {
  return DB.teams.filter(t => t.name !== 'פייסרים');
}

// Alternative scoring: every team in a round (same date) is compared
// against every OTHER team that played that date, not just its own
// scheduled pairing — 1 point per game beaten (0.5 on a tie), 1 more for
// the higher series total, plus the same high-score bonus. Mirrors the
// admin app's computeRoundRobinTeamPoints().
function computeRoundRobinTeamPoints(DB) {
  // Same per-win point values as the standard method (Settings → כללי
  // ניקוד), just applied against every other team in the round instead of
  // one scheduled opponent — so beating all N-1 other teams in a game earns
  // (N-1) × pointsPerGameWin, and likewise for the series with its own
  // (usually higher) weight.
  const gw = DB.settings.pointsPerGameWin ?? 1;
  const sw = DB.settings.pointsPerSeriesWin ?? 2;
  const byDate = {};
  DB.results.filter(r => !r.isPractice).forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = [];
    byDate[r.date].push(r);
  });
  const teamPoints = {};
  schedulableTeams(DB).forEach(t => { teamPoints[t.id] = 0; });
  Object.values(byDate).forEach(roundResults => {
    const roundTeams = {};
    roundResults.forEach(r => {
      const aGames = (r.games || []).map(g => gameTotal(g, 'A'));
      const bGames = (r.games || []).map(g => gameTotal(g, 'B'));
      const aBonus = (r.games || []).reduce((s, g) => s + (g.teamABonus || 0), 0);
      const bBonus = (r.games || []).reduce((s, g) => s + (g.teamBBonus || 0), 0);
      roundTeams[r.teamAId] = { games: aGames, series: aGames.reduce((s, v) => s + v, 0), bonus: aBonus, forfeit: !!r.teamAForfeit };
      roundTeams[r.teamBId] = { games: bGames, series: bGames.reduce((s, v) => s + v, 0), bonus: bBonus, forfeit: !!r.teamBForfeit };
    });
    const teamIds = Object.keys(roundTeams);
    teamIds.forEach(teamId => {
      const me = roundTeams[teamId];
      if (me.forfeit) return;
      let pts = 0;
      teamIds.forEach(otherId => {
        if (otherId === teamId) return;
        const other = roundTeams[otherId];
        me.games.forEach((g, i) => {
          const og = other.games[i] ?? 0;
          if (g > og) pts += gw; else if (g === og) pts += gw / 2;
        });
        if (me.series > other.series) pts += sw;
        else if (me.series === other.series) pts += sw / 2;
      });
      teamPoints[teamId] = (teamPoints[teamId] || 0) + pts + me.bonus;
    });
  });
  return teamPoints;
}

// Ranks teams purely by total (handicap-inclusive) pins scored that round —
// no per-opponent game/series comparison, no high-score bonus. Mirrors
// admin.html's computePinsLadderTeamPoints(); see its comment for the tie
// rule (tied teams share the average of the ladder values for the ranks
// they collectively occupy).
function computePinsLadderTeamPoints(DB) {
  const top = DB.settings.pinsLadderTop ?? 18;
  const step = DB.settings.pinsLadderStep ?? 2;
  const byDate = {};
  DB.results.filter(r => !r.isPractice).forEach(r => {
    if (!byDate[r.date]) byDate[r.date] = [];
    byDate[r.date].push(r);
  });
  const teamPoints = {};
  schedulableTeams(DB).forEach(t => { teamPoints[t.id] = 0; });

  Object.values(byDate).forEach(roundResults => {
    const roundPins = {};
    roundResults.forEach(r => {
      if (!r.teamAForfeit) roundPins[r.teamAId] = (r.games || []).reduce((s, g) => s + gameTotal(g, 'A'), 0);
      if (r.teamBId && !r.teamBForfeit) roundPins[r.teamBId] = (r.games || []).reduce((s, g) => s + gameTotal(g, 'B'), 0);
    });
    const ranked = Object.entries(roundPins).sort((a, b) => b[1] - a[1]);
    let i = 0;
    while (i < ranked.length) {
      let j = i;
      while (j + 1 < ranked.length && ranked[j + 1][1] === ranked[i][1]) j++;
      let sum = 0;
      for (let k = i; k <= j; k++) sum += Math.max(0, top - step * k);
      const avg = sum / (j - i + 1);
      for (let k = i; k <= j; k++) {
        const teamId = ranked[k][0];
        teamPoints[teamId] = (teamPoints[teamId] || 0) + avg;
      }
      i = j + 1;
    }
  });
  return teamPoints;
}

// Points a team earned for ONE round under the alternative scoring methods
// (roundRobin/pinsLadder), where a team is compared against everyone who
// played that date rather than a single scheduled opponent — so a single
// match card's "team A vs team B" pairing no longer has a meaningful head-
// to-head score. Reuses the season-total functions above by scoping them
// to just that date's results. Returns null for the standard method, where
// the pairwise teamAPoints/teamBPoints already stored on the result apply.
function roundPointsFor(DB, dateStr) {
  const method = DB.settings && DB.settings.scoringMethod;
  if (method !== 'roundRobin' && method !== 'pinsLadder') return null;
  const roundDB = { ...DB, results: DB.results.filter(r => r.date === dateStr) };
  return method === 'roundRobin' ? computeRoundRobinTeamPoints(roundDB) : computePinsLadderTeamPoints(roundDB);
}

// Points every team earned for ONE round, whichever scoring method is
// active — wraps roundPointsFor (alt methods) with the standard method's
// own pairwise teamAPoints/teamBPoints, so callers don't need to branch on
// DB.settings.scoringMethod themselves.
function teamPointsForRound(DB, dateStr) {
  const alt = roundPointsFor(DB, dateStr);
  if (alt) return alt;
  const pts = {};
  DB.results.filter(r => !r.isPractice && r.date === dateStr).forEach(r => {
    pts[r.teamAId] = (pts[r.teamAId] || 0) + (r.teamAPoints || 0);
    if (r.teamBId) pts[r.teamBId] = (pts[r.teamBId] || 0) + (r.teamBPoints || 0);
  });
  return pts;
}

// Handicap for the public roster view — mirrors admin.html's
// computeHandicap: manual handicap/average (for players without game
// history yet) take priority over the auto formula, which otherwise
// assumes "scratch" (handicap 0) until a player has a real average.
function computeHandicap(DB, playerId, playerStats) {
  if (!DB.settings.handicapEnabled) return 0;
  const p = DB.players.find(x => x.id === playerId);
  const st = playerStats[playerId] || { games: 0, total: 0 };
  const basis = DB.settings.handicapBasis ?? 200;
  const pct = (DB.settings.handicapPercent ?? 80) / 100;
  if (!st.games) {
    if (p && p.manualHandicap != null) return p.manualHandicap;
    if (p && p.manualAverage != null) return Math.max(0, Math.round((basis - p.manualAverage) * pct));
  }
  const avg = st.games ? st.total / st.games : basis;
  return Math.max(0, Math.round((basis - avg) * pct));
}

// Set inside renderContent() each render — lets the round <select> in the
// "תוצאות אחרונות" tab re-render just its cards on change, without a full
// page re-render or a module-level copy of DB.
let renderResultsForDate = null;

// Set inside renderContent() each render — a small pattern-matching Q&A
// over the already-computed stats (no AI, no backend: a free-text box that
// hits a real API would need a server-side key, which can't live safely in
// a public page). Recognizes a fixed set of question shapes; anything else
// gets a fallback listing what it does understand.
let answerDataQuestion = null;

function renderContent(DB) {
  const el = document.getElementById('content');

  // Team standings
  const altPoints = DB.settings && DB.settings.scoringMethod === 'roundRobin' ? computeRoundRobinTeamPoints(DB)
    : DB.settings && DB.settings.scoringMethod === 'pinsLadder' ? computePinsLadderTeamPoints(DB) : null;
  const teamMap = {};
  schedulableTeams(DB).forEach(t => { teamMap[t.id] = { team: t, played: 0, points: 0, pins: 0 }; });
  DB.results.filter(r => !r.isPractice).forEach(r => {
    const a = teamMap[r.teamAId], b = teamMap[r.teamBId];
    const aPins = (r.games || []).reduce((s, g) => s + gameTotal(g, 'A'), 0);
    const bPins = (r.games || []).reduce((s, g) => s + gameTotal(g, 'B'), 0);
    if (a) { a.played++; a.pins += aPins; if (!altPoints) a.points += r.teamAPoints || 0; }
    if (b) { b.played++; b.pins += bPins; if (!altPoints) b.points += r.teamBPoints || 0; }
  });
  if (altPoints) { Object.keys(teamMap).forEach(tid => { teamMap[tid].points = altPoints[tid] || 0; }); }
  const teamStandings = Object.values(teamMap).sort((x, y) => y.points - x.points || y.pins - x.pins);

  // Player standings — a player marked absent gets an auto-filled score so
  // their team's total isn't hurt, but it's not a real game of theirs, so
  // it's skipped here (and in every other personal-stat list below).
  const playerStats = {};
  DB.players.forEach(p => { playerStats[p.id] = { player: p, games: 0, total: 0, high: 0 }; });
  DB.results.forEach(r => (r.games || []).forEach(g => {
    Object.entries(g.playerScores || {}).forEach(([pid, score]) => {
      if (!playerStats[pid] || score == null) return;
      if (r.absentPlayerIds && r.absentPlayerIds.includes(pid)) return;
      playerStats[pid].games++;
      playerStats[pid].total += score;
      if (score > playerStats[pid].high) playerStats[pid].high = score;
    });
  }));
  const playerStandings = Object.values(playerStats)
    .filter(s => s.games > 0)
    .map(s => ({ ...s, avg: s.total / s.games }))
    .sort((a, b) => b.avg - a.avg || b.games - a.games);

  const teamName = id => (DB.teams.find(t => t.id === id) || {}).name || '—';
  const teamColor = id => (DB.teams.find(t => t.id === id) || {}).color || '#94A3B8';
  const playerName = pid => (DB.players.find(p => p.id === pid) || {}).name || '—';
  const playerTeamId = pid => (DB.players.find(p => p.id === pid) || {}).teamId || '';
  const rankClass = i => i === 0 ? 'rank-1' : i === 1 ? 'rank-2' : i === 2 ? 'rank-3' : '';
  const teamCell = pid => playerTeamId(pid) ? `<span class="color-dot" style="background:${teamColor(playerTeamId(pid))}"></span>${teamName(playerTeamId(pid))}` : '—';

  // Round all-stars: top 5 individual series totals from the most recent match date
  const leagueResults = DB.results.filter(r => !r.isPractice);
  const latestDate = leagueResults.length ? leagueResults.reduce((max, r) => (r.date > max ? r.date : max), leagueResults[0].date) : null;
  const roundEntries = [];
  if (latestDate) {
    leagueResults.filter(r => r.date === latestDate).forEach(r => {
      const absent = r.absentPlayerIds || [];
      const pids = new Set();
      (r.games || []).forEach(g => Object.keys(g.playerScores || {}).forEach(pid => { if (!absent.includes(pid)) pids.add(pid); }));
      pids.forEach(pid => {
        const total = (r.games || []).reduce((s, g) => s + ((g.playerScores && g.playerScores[pid]) || 0), 0);
        roundEntries.push({ pid, total });
      });
    });
  }
  const roundAllStars = roundEntries.sort((a, b) => b.total - a.total).slice(0, 5);
  const lastRoundResults = latestDate ? leagueResults.filter(r => r.date === latestDate) : [];

  // All-time single-game high scores (top 3) — absent-filled scores excluded
  const singleGameEntries = [];
  DB.results.forEach(r => (r.games || []).forEach(g => {
    Object.entries(g.playerScores || {}).forEach(([pid, score]) => {
      if (score != null && !(r.absentPlayerIds && r.absentPlayerIds.includes(pid))) singleGameEntries.push({ pid, score, date: r.date });
    });
  }));
  const topSingleGames = singleGameEntries.sort((a, b) => b.score - a.score).slice(0, 3);

  // All-time series high (top 3) — absent-filled scores excluded
  const seriesEntries = [];
  DB.results.forEach(r => {
    const absent = r.absentPlayerIds || [];
    const pids = new Set();
    (r.games || []).forEach(g => Object.keys(g.playerScores || {}).forEach(pid => { if (!absent.includes(pid)) pids.add(pid); }));
    pids.forEach(pid => {
      const total = (r.games || []).reduce((s, g) => s + ((g.playerScores && g.playerScores[pid]) || 0), 0);
      seriesEntries.push({ pid, total, date: r.date, gamesCount: (r.games || []).length });
    });
  });
  const topSeries = seriesEntries.sort((a, b) => b.total - a.total).slice(0, 3);

  // All-time team series high (top 3) — pure pinfall, without handicap
  // (unlike team standings, which stays handicap-inclusive).
  const teamSeriesEntries = [];
  leagueResults.forEach(r => {
    const aTotal = (r.games || []).reduce((s, g) => s + rawGameTotal(g, 'A'), 0);
    const bTotal = (r.games || []).reduce((s, g) => s + rawGameTotal(g, 'B'), 0);
    teamSeriesEntries.push({ teamId: r.teamAId, total: aTotal, date: r.date });
    teamSeriesEntries.push({ teamId: r.teamBId, total: bTotal, date: r.date });
  });
  const topTeamSeries = teamSeriesEntries.sort((a, b) => b.total - a.total).slice(0, 3);

  // All-time team single-game high (top 3) — best team total, pure pinfall
  // without handicap, in ONE game (unlike topTeamSeries above, which sums
  // the whole match).
  const teamGameEntries = [];
  leagueResults.forEach(r => {
    (r.games || []).forEach(g => {
      teamGameEntries.push({ teamId: r.teamAId, total: rawGameTotal(g, 'A'), date: r.date });
      teamGameEntries.push({ teamId: r.teamBId, total: rawGameTotal(g, 'B'), date: r.date });
    });
  });
  const topTeamGames = teamGameEntries.sort((a, b) => b.total - a.total).slice(0, 3);

  // Women-only personal records — only shown once there are at least 2
  // registered female players, so the tables aren't a near-empty ranking.
  const playerGender = pid => (DB.players.find(p => p.id === pid) || {}).gender || '';
  const womenCount = DB.players.filter(p => p.gender === 'אישה').length;
  const topSingleGamesWomen = singleGameEntries.filter(e => playerGender(e.pid) === 'אישה').sort((a, b) => b.score - a.score).slice(0, 3);
  const topSeriesWomen = seriesEntries.filter(e => playerGender(e.pid) === 'אישה').sort((a, b) => b.total - a.total).slice(0, 3);

  // Team rosters: every player's average plus the team's total handicap.
  const hcpOn = !!(DB.settings && DB.settings.handicapEnabled);
  const teamsHtml = DB.teams.length ? DB.teams.map(t => {
    const allPlayers = DB.players.filter(p => p.teamId === t.id);
    const captain = t.captainId ? allPlayers.find(p => p.id === t.captainId) : null;
    const players = captain ? [captain, ...allPlayers.filter(p => p.id !== t.captainId)] : allPlayers;
    const unlimited = t.name === 'פייסרים';
    const rows = players.map(p => {
      const st = playerStats[p.id] || { games: 0, total: 0 };
      const avgText = st.games ? (st.total / st.games).toFixed(2) : (p.manualAverage != null ? `${p.manualAverage.toFixed(2)} <span style="color:#94A3B8; font-size:11px;">(ידני)</span>` : '—');
      return `<tr><td>${p.name}</td><td style="text-align:center;">${avgText}</td></tr>`;
    }).join('') || `<tr><td colspan="2" style="text-align:center; color:#94A3B8;">אין שחקנים בקבוצה זו</td></tr>`;
    const hcpSum = players.reduce((s, p) => s + computeHandicap(DB, p.id, playerStats), 0);
    return `<div class="card" style="padding:16px;">
      <h3 style="font-size:15px; margin-bottom:10px;"><span class="color-dot" style="background:${t.color || '#94A3B8'}"></span>${t.name}${unlimited ? ` <span style="font-size:11px; color:#F59E0B; font-weight:400;">(לא משתתפת בתחרות הקבוצתית)</span>` : ''}</h3>
      <div class="table-wrap"><table>
        <thead><tr><th>שחקן</th><th style="text-align:center;">ממוצע</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${unlimited ? `<p style="font-size:11px; color:#94A3B8; margin-top:12px;">משחקי השחקנים נספרים רק לממוצע האישי שלהם</p>` : (hcpOn ? `<p style="margin-top:12px; font-size:13px; color:#0369A1; font-weight:700;">סה"כ הנדיקפ קבוצתי: ${hcpSum}</p>` : '')}
    </div>`;
  }).join('') : `<div class="card"><p style="text-align:center;color:#94A3B8;">אין קבוצות עדיין</p></div>`;

  const upcoming = DB.schedule.filter(s => s.status !== 'completed').sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  // Round selector for the "תוצאות אחרונות" tab — defaults to the latest
  // played round, but any round with saved results can be picked.

  answerDataQuestion = function(qRaw) {
    // matched=true for every branch below except the final catch-all, even
    // when a lookup inside the branch comes up empty (e.g. an unknown
    // player name) — the question's SHAPE was still understood, which is
    // the useful signal for saveAskedQuestion()'s log.
    function reply(text, matched) { return { text, matched: matched !== false }; }

    const q = (qRaw || '').trim();
    if (!q) return reply('נא להקליד שאלה.');
    // Strip punctuation so "מי מוביל?" and "מי מוביל" match the same way.
    const norm = q.replace(/[?!.,;:״"]/g, ' ').replace(/\s+/g, ' ').trim();

    function findPlayer(fragment) {
      const f = (fragment || '').trim();
      return f ? DB.players.find(p => p.name && p.name.includes(f)) || null : null;
    }
    function findTeam(fragment) {
      const f = (fragment || '').trim();
      return f ? DB.teams.find(t => t.name && t.name.includes(f)) || null : null;
    }

    // "Who's leading" — ambiguous between team and personal unless the
    // question names which (this league tracks both rankings separately,
    // and a bare "מי מוביל?" could reasonably mean either), so the default
    // is to answer with both rather than guess.
    if (/^מי (מוביל|ראשון|בפסגה|בראש)|מי (ה)?שחקן(ית)?.*(הכי טוב|מוביל|הממוצע הגבוה)|מי מוביל בממוצע/.test(norm)) {
      const wantsPlayerOnly = /שחקן|שחקנית|אישי|ממוצע/.test(norm) && !/קבוצ/.test(norm);
      const wantsTeamOnly = /קבוצ/.test(norm) && !/שחקן|שחקנית|אישי/.test(norm);
      const teamAnswer = teamStandings.length
        ? `הקבוצה המובילה (דירוג קבוצתי) היא ${teamStandings[0].team.name}, עם ${teamStandings[0].points} נקודות ליגה ו-${teamStandings[0].pins} פינים.`
        : 'עדיין אין נתוני דירוג קבוצתי.';
      const playerAnswer = playerStandings.length
        ? `השחקן המוביל (דירוג אישי) הוא ${playerStandings[0].player.name}, עם ממוצע ${playerStandings[0].avg.toFixed(2)} (${playerStandings[0].games} משחקים).`
        : 'עדיין אין נתוני דירוג אישי.';
      if (wantsTeamOnly) return reply(teamAnswer);
      if (wantsPlayerOnly) return reply(playerAnswer);
      return reply(`${teamAnswer}\n${playerAnswer}`);
    }

    // Personal average lookup: "מה הממוצע של X" / "כמה ממוצע יש ל-X"
    let m = norm.match(/(?:מה הממוצע (?:האישי )?של|כמה ממוצע יש ל)\s*(.+)/);
    if (m) {
      const p = findPlayer(m[1]);
      if (!p) return reply(`לא מצאתי שחקן בשם "${m[1].trim()}".`);
      const st = playerStandings.find(s => s.player.id === p.id);
      if (!st) return reply(`ל${p.name} אין עדיין משחקים רשומים.`);
      return reply(`הממוצע של ${p.name} הוא ${st.avg.toFixed(2)}, על סמך ${st.games} משחקים (ציון גבוה: ${st.high}).`);
    }

    // Standing lookup by name: "כמה נקודות יש ל-X" / "מה המצב של X" /
    // "באיזה מקום X" — X might be a team or a player (team names are often
    // a captain's own name in this league, so the same word can be both),
    // so check both and answer with whichever actually match, labeled when
    // both do.
    m = norm.match(/(?:כמה נקודות יש ל|מה המצב של(?: קבוצת)?|באיזה מקום (?:נמצאת|נמצא))\s*(.+)/);
    if (m) {
      const t = findTeam(m[1]);
      const p = findPlayer(m[1]);
      if (!t && !p) return reply(`לא מצאתי קבוצה או שחקן בשם "${m[1].trim()}".`);
      const parts = [];
      if (t) {
        const idx = teamStandings.findIndex(s => s.team.id === t.id);
        const label = (t && p) ? 'קבוצתית — ' : '';
        parts.push(idx === -1
          ? `${label}לקבוצת ${t.name} אין עדיין משחקים רשומים.`
          : `${label}${t.name} נמצאת במקום ${idx + 1} מתוך ${teamStandings.length}, עם ${teamStandings[idx].points} נקודות ו-${teamStandings[idx].pins} פינים.`);
      }
      if (p) {
        const pidx = playerStandings.findIndex(s => s.player.id === p.id);
        const label = (t && p) ? 'אישית — ' : '';
        parts.push(pidx === -1
          ? `${label}ל${p.name} אין עדיין משחקים רשומים.`
          : `${label}${p.name} במקום ${pidx + 1} בדירוג האישי, עם ממוצע ${playerStandings[pidx].avg.toFixed(2)}.`);
      }
      return reply(parts.join('\n'));
    }

    // All-time single-game record
    if (/שיא(?! קבוצתי)|הציון הכי גבוה|מי שבר את השיא/.test(norm)) {
      if (!topSingleGames.length) return reply('עדיין אין שיאים רשומים.');
      const r = topSingleGames[0];
      return reply(`השיא האישי למשחק בודד הוא ${r.score} פינים, של ${playerName(r.pid)}, בתאריך ${fmtDate(r.date)}.`);
    }

    // Next round
    if (/מתי (ה)?(משחק|מחזור) הבא/.test(norm)) {
      if (!upcoming.length) return reply('אין כרגע משחקים מתוכננים בלוח.');
      return reply(`המחזור הבא הוא ב-${fmtDate(upcoming[0].date)}.`);
    }

    // Last round results
    if (/(מה (היה|קרה) ב|תוצאות ה|מי ניצח ב).*מחזור האחרון/.test(norm)) {
      if (!lastRoundResults.length) return reply('עדיין אין תוצאות.');
      const lines = lastRoundResults.map(r => `${teamName(r.teamAId)} נגד ${teamName(r.teamBId)}`);
      return reply(`במחזור האחרון (${fmtDate(latestDate)}) שוחקו: ${lines.join(', ')}.`);
    }

    // Simple counts
    if (/כמה קבוצות/.test(norm)) return reply(`יש ${schedulableTeams(DB).length} קבוצות בתחרות הקבוצתית.`);
    if (/כמה שחקנים/.test(norm)) return reply(`רשומים ${DB.players.length} שחקנים בליגה.`);

    return reply('לא הצלחתי להבין את השאלה. אפשר לנסות למשל: "מי מוביל?", "מה הממוצע של [שם שחקן]?", "מה השיא האישי?", "מתי המחזור הבא?", "כמה נקודות יש ל[קבוצה]?".', false);
  };

                <td>${fmtDate(e.date)}</td>
              </tr>`).join('') : `<tr><td colspan="5" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
          </tbody>
        </table></div>
      </div>` : ''}
    </div>

    <div class="section" id="section-teams">
      <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;">
        ${teamsHtml}
      </div>
    </div>

    <div class="section" id="section-schedule">
      <div class="card">
        <h2>משחקים קרובים</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>תאריך</th><th>שעה</th><th>מסלול</th><th>מחזור</th><th>קבוצה א׳</th><th>קבוצה ב׳</th></tr></thead>
          <tbody>
            ${upcoming.length ? upcoming.map(s => `
              <tr>
                <td>${fmtDate(s.date)}</td>
                <td>${s.time || '—'}</td>
                <td>${s.lane || '—'}</td>
                <td>${s.round || '—'}</td>
                <td>${teamName(s.teamAId)}</td>
                <td>${s.teamBId ? teamName(s.teamBId) : '<span style="color:#94A3B8;">ניקוד אישי</span>'}</td>
              </tr>`).join('') : `<tr><td colspan="6" style="text-align:center;color:#94A3B8;">אין משחקים מתוכננים</td></tr>`}
          </tbody>
        </table></div>
      </div>
    </div>

    <div class="section" id="section-results">
      ${resultRoundDates.length ? `
      <div class="card" style="margin-bottom:20px;">
        <label style="font-size:13px; font-weight:600; color:#0C4A6E;">בחר מחזור:</label>
        <select id="results-round-select" onchange="switchResultsRound(this.value)" style="margin-right:8px; padding:6px 10px; border-radius:8px; border:1px solid #CBD5E1; font-family:inherit; font-size:14px;">
          ${resultRoundDates.map(d => `<option value="${d}" ${d === resultRoundDates[0] ? 'selected' : ''}>${fmtDate(d)}</option>`).join('')}
        </select>
      </div>` : ''}
      <div id="results-cards">${buildResultCardsHtml(resultRoundDates[0] || null)}</div>
    </div>

    <div class="section" id="section-charts">
      <div class="card">
        <h2>&#x1F4AC; שאל שאלה על הנתונים</h2>
        <p style="font-size:12px; color:#94A3B8; margin-bottom:10px;">אפשר ללחוץ על אחת מהשאלות המוכנות, או להקליד שאלה חופשית בניסוח דומה.</p>
        <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;">
          <button type="button" class="qa-chip" onclick="askPresetQuestion('מי מוביל?')">מי מוביל?</button>
          <button type="button" class="qa-chip" onclick="askPresetQuestion('מי השחקן הכי טוב?')">מי השחקן הכי טוב?</button>
          <button type="button" class="qa-chip" onclick="askPresetQuestion('מה השיא האישי?')">מה השיא האישי?</button>
          <button type="button" class="qa-chip" onclick="askPresetQuestion('מתי המחזור הבא?')">מתי המחזור הבא?</button>
          <button type="button" class="qa-chip" onclick="askPresetQuestion('מה היה במחזור האחרון?')">מה היה במחזור האחרון?</button>
          <button type="button" class="qa-chip" onclick="askPresetQuestion('כמה קבוצות יש?')">כמה קבוצות יש?</button>
          <button type="button" class="qa-chip" onclick="askPresetQuestion('מה הממוצע של ', false)">מה הממוצע של... &#x270F;&#xFE0F;</button>
          <button type="button" class="qa-chip" onclick="askPresetQuestion('כמה נקודות יש ל', false)">כמה נקודות יש ל... &#x270F;&#xFE0F;</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <input type="text" id="data-question-input" placeholder="או הקלד שאלה חופשית..." onkeydown="if(event.key==='Enter'){event.preventDefault();askDataQuestion();}" style="flex:1; min-width:200px; padding:9px 12px; border-radius:8px; border:1.5px solid #BAE6FD; font-family:inherit; font-size:14px; color:#0C4A6E;">
          <button type="button" class="ask-btn" onclick="askDataQuestion()">&#x1F50D; שאל</button>
        </div>
        <div id="data-question-answer" style="margin-top:12px; font-size:14px; color:#0C4A6E; background:#F0F9FF; border-radius:8px; padding:10px 12px; display:none;"></div>
      </div>
      <div class="card">
        ${(() => {
          const roundDates = [...resultRoundDates].reverse();
          const playedSet = new Set(roundDates);
          const rounds = withNextRound(DB, roundDates).map(d => ({
            date: d,
            label: (DB.schedule.find(s => s.date === d && s.round) || {}).round || fmtDate(d),
            avg: playedSet.has(d) ? avgPinsForRound(DB, d) : null
          }));
          return `
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
            <h2 style="margin-bottom:0;">&#x1F4C8; ממוצע פינים למשחק, לפי מחזור — כל השחקנים יחד</h2>
            <div role="group" aria-label="תצוגה">
              <button type="button" id="round-pins-btn-chart" class="chart-toggle-btn" aria-pressed="true" onclick="toggleChartView('round-pins', 'chart')">גרף</button>
              <button type="button" id="round-pins-btn-table" class="chart-toggle-btn" aria-pressed="false" onclick="toggleChartView('round-pins', 'table')">טבלה</button>
            </div>
          </div>
          <p style="font-size:12px; color:#94A3B8; margin-bottom:10px;">ממוצע פינים גולמי (ללא הנדיקפ) למשחק בודד, על פני כל השחקנים במחזור — משחקי קבוצות ותרגול פייסרים יחד. מחושב לפי משחק (לא לפי שחקן), כך שמספר המשתתפים במחזור לא משפיע על הממוצע.</p>
          <div id="round-pins-chart-wrap" class="chart-wrap">${buildRoundPinsChartHtml(rounds)}</div>
          <div id="round-pins-table-wrap" class="table-wrap" style="display:none;">
            <table>
              <thead><tr><th>מחזור</th><th>תאריך</th><th>ממוצע פינים למשחק</th></tr></thead>
              <tbody>
                ${rounds.length ? rounds.map(r => `<tr><td>${r.label}</td><td>${fmtDate(r.date)}</td><td>${r.avg != null ? r.avg.toFixed(1) : '—'}</td></tr>`).join('') : `<tr><td colspan="3" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
              </tbody>
            </table>
          </div>`;
        })()}
      </div>
      <div class="card">
        ${(() => {
          const teamsForChart = schedulableTeams(DB);
          const roundDatesAsc = [...new Set(leagueResults.map(r => r.date))].sort();
          const playedSet = new Set(roundDatesAsc);
          const cum = {};
          teamsForChart.forEach(t => { cum[t.id] = 0; });
          const roundsForChart = withNextRound(DB, roundDatesAsc).map(d => {
            const label = (DB.schedule.find(s => s.date === d && s.round) || {}).round || fmtDate(d);
            if (!playedSet.has(d)) return { date: d, label, cum: null };
            const pts = teamPointsForRound(DB, d);
            teamsForChart.forEach(t => { cum[t.id] = (cum[t.id] || 0) + (pts[t.id] || 0); });
            return { date: d, label, cum: { ...cum } };
          });
          return `
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
            <h2 style="margin-bottom:0;">&#x1F4C8; מגמת נקודות קבוצתית לאורך העונה</h2>
            <div role="group" aria-label="תצוגה">
              <button type="button" id="team-points-btn-chart" class="chart-toggle-btn" aria-pressed="true" onclick="toggleChartView('team-points', 'chart')">גרף</button>
              <button type="button" id="team-points-btn-table" class="chart-toggle-btn" aria-pressed="false" onclick="toggleChartView('team-points', 'table')">טבלה</button>
            </div>
          </div>
          <p style="font-size:12px; color:#94A3B8; margin-bottom:10px;">נקודות ליגה מצטברות לכל קבוצה, מחזור אחרי מחזור. ריחוף או פוקוס על מחזור מציג את הערכים של כל הקבוצות באותה נקודה.</p>
          <div id="team-points-chart-wrap" class="chart-wrap">${buildTeamPointsLineChartHtml(teamsForChart, roundsForChart)}</div>
          <div style="display:flex; flex-wrap:wrap; gap:2px 12px; margin-top:10px;">${teamsForChart.map(t => `<span style="display:inline-flex; align-items:center; gap:4px; font-size:12px; color:#0C4A6E;"><span class="color-dot" style="background:${t.color || '#94A3B8'}"></span>${t.name}</span>`).join('')}</div>
          <div id="team-points-table-wrap" class="table-wrap" style="display:none; margin-top:10px;">
            <table>
              <thead><tr><th>מחזור</th>${teamsForChart.map(t => `<th style="text-align:center;"><span class="color-dot" style="background:${t.color || '#94A3B8'}"></span>${t.name}</th>`).join('')}</tr></thead>
              <tbody>
                ${roundsForChart.length ? roundsForChart.map(r => `<tr><td>${r.label}</td>${teamsForChart.map(t => `<td style="text-align:center;">${r.cum ? (r.cum[t.id] || 0) : '—'}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${teamsForChart.length + 1}" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
              </tbody>
            </table>
          </div>`;
        })()}
      </div>
      <div class="card">
        ${(() => {
          const roundDatesAsc = [...new Set(DB.results.filter(r => r.date).map(r => r.date))].sort();
          const milestones = recordMilestones(DB, roundDatesAsc);
          const roundDatesExtended = withNextRound(DB, roundDatesAsc);
          return `
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
            <h2 style="margin-bottom:0;">&#x23F1;&#xFE0F; שיאים אישיים לאורך הזמן</h2>
            <div role="group" aria-label="תצוגה">
              <button type="button" id="records-btn-chart" class="chart-toggle-btn" aria-pressed="true" onclick="toggleChartView('records', 'chart')">גרף</button>
              <button type="button" id="records-btn-table" class="chart-toggle-btn" aria-pressed="false" onclick="toggleChartView('records', 'table')">טבלה</button>
            </div>
          </div>
          <p style="font-size:12px; color:#94A3B8; margin-bottom:10px;">כל פעם שהשיא האישי למשחק בודד (כל השחקנים, כולל תרגול פייסרים) נשבר — מתי וע"י מי.</p>
          <div id="records-chart-wrap" class="chart-wrap">${buildRecordsTimelineChartHtml(roundDatesExtended, milestones, playerName)}</div>
          <div id="records-table-wrap" class="table-wrap" style="display:none;">
            <table>
              <thead><tr><th>#</th><th>שחקן</th><th>ציון</th><th>תאריך</th></tr></thead>
              <tbody>
                ${milestones.length ? milestones.map((m, i) => `<tr><td>${i + 1}</td><td>${playerName(m.pid)}</td><td><strong>${m.score}</strong></td><td>${fmtDate(m.date)}</td></tr>`).join('') : `<tr><td colspan="4" style="text-align:center;color:#94A3B8;">אין נתונים עדיין</td></tr>`}
              </tbody>
            </table>
          </div>`;
        })()}
      </div>
    </div>

    <div id="chart-tooltip" class="chart-tooltip"></div>
  `;
}

function switchResultsRound(dateStr) {
  const wrap = document.getElementById('results-cards');
  if (wrap && renderResultsForDate) wrap.innerHTML = renderResultsForDate(dateStr);
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.section').forEach(s => s.classList.toggle('active', s.id === 'section-' + name));
}

function askDataQuestion() {
  const input = document.getElementById('data-question-input');
  const out = document.getElementById('data-question-answer');
  if (!input || !out) return;
  const q = input.value;
  if (!q.trim()) { out.style.display = 'none'; return; }
  const result = answerDataQuestion ? answerDataQuestion(q) : { text: 'הנתונים עדיין נטענים — נסה שוב בעוד רגע.', matched: false };
  out.textContent = result.text;
  out.style.display = 'block';
  saveAskedQuestion(q, result.text, result.matched);
}

// Logs every question asked (preset or free-typed) to Firestore, purely so
// admin.html can review what visitors are asking — never blocks or shows
// an error to the visitor if it fails; this is a background nicety, not
// something the Q&A feature depends on. Signs this page in anonymously on
// first use (lazy — most visits never touch this box, so there's no reason
// to authenticate on every page load just for this).
async function saveAskedQuestion(question, answerText, matched) {
  if (!fdb || typeof firebase === 'undefined') return;
  try {
    if (!firebase.auth().currentUser) await firebase.auth().signInAnonymously();
    const id = 'q_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    await fdb.collection('dataQuestions').doc(id).set({
      id, question, answer: answerText, matched: !!matched,
      createdAt: new Date().toISOString()
    });
  } catch (e) {
    console.warn('saveAskedQuestion:', e.message);
  }
}

// Fills the question box from one of the preset chips. autoAsk (default
// true) answers immediately; the two "...✏️" templates pass false instead,
// since they need a name/team typed in before they mean anything — the box
// is filled and focused so the visitor just continues typing.
function askPresetQuestion(q, autoAsk) {
  const input = document.getElementById('data-question-input');
  if (!input) return;
  input.value = q;
  input.focus();
  input.setSelectionRange(q.length, q.length);
  if (autoAsk !== false) askDataQuestion();
  else document.getElementById('data-question-answer').style.display = 'none';
}

async function boot() {
  document.getElementById('footer-year').textContent = new Date().getFullYear();

  if (!FIREBASE_CONFIG.apiKey || !FIREBASE_CONFIG.projectId) {
    document.getElementById('content').innerHTML = `
      <div class="config-msg">
        &#x26A0;&#xFE0F; העמוד עדיין לא מחובר לנתוני הליגה.<br><br>
        יש להשלים את אובייקט <code>FIREBASE_CONFIG</code> בקובץ <code>index.html</code>
        עם אותם הפרטים שהוזנו בעמוד הניהול (admin.html).
      </div>`;
    return;
  }

  const sdkLoaded = await loadFirebaseSDK();
  if (!sdkLoaded) {
    document.getElementById('content').innerHTML = `<div class="config-msg">&#x26A0;&#xFE0F; לא ניתן היה לטעון את נתוני הליגה — בדוק חיבור לאינטרנט ונסה לרענן.</div>`;
    return;
  }

  try {
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    fdb = firebase.firestore();
    const [t, p, s, r, cfg] = await Promise.all([
      fdb.collection('teams').get(),
      fdb.collection('players').get(),
      fdb.collection('schedule').get(),
      fdb.collection('results').get(),
      fdb.collection('settings').doc('config').get()
    ]);
    const settings = cfg.exists ? cfg.data() : {};
    if (cfg.exists) {
      if (settings.leagueName) {
        document.getElementById('league-name').textContent = settings.leagueName;
        document.title = settings.leagueName;
      }
      if (settings.logoData) {
        document.getElementById('league-logo').innerHTML = `<img src="${settings.logoData}" alt="">`;
      }
    }
    renderContent({
      teams: t.docs.map(d => d.data()),
      players: p.docs.map(d => d.data()),
      schedule: s.docs.map(d => d.data()),
      results: r.docs.map(d => d.data()),
      settings
    });
  } catch(e) {
    console.warn('Load error:', e.message);
    document.getElementById('content').innerHTML = `<div class="config-msg">&#x26A0;&#xFE0F; שגיאה בטעינת נתוני הליגה. נסה לרענן את הדף מאוחר יותר.</div>`;
  }
}

boot();
</script>
</body>
</html>
